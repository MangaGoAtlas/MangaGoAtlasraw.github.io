<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow,max-image-preview:large"><link rel="canonical" href="https://mangogoatlasraw.github.io/latest-chapters.html"><title>Latest Manga Chapters | MangaGoAtlas</title><meta name="description" content="Browse recently published Japanese manga chapters on MangaGoAtlas."><style>*{box-sizing:border-box}body{margin:0;background:#08090d;color:#f5f5f7;font-family:Inter,system-ui,sans-serif}a{text-decoration:none;color:inherit}.nav{min-height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 5%;border-bottom:1px solid #20222b;background:#0b0c11}.brand{font-size:24px;font-weight:800}.brand span{color:#5b8bd9}.navlinks{display:flex;gap:18px;color:#aeb3c0;font-size:14px}.hero{padding:40px 5%;background:radial-gradient(circle at 80% 20%,#142d52,#111018 40%,#08090d 75%)}h1{margin:0 0 10px;font-size:clamp(34px,5vw,58px)}.hero p{color:#b8bbc6;line-height:1.7}.wrap{max-width:1300px;margin:auto;padding:30px 5%}.count{color:#8f96a6;margin:0 0 22px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}.card{display:block;position:relative;min-height:320px;border:1px solid #292d38;border-radius:14px;overflow:hidden;background:#101218}.card img{width:100%;height:320px;object-fit:cover;display:block}.overlay{position:absolute;inset:auto 0 0;padding:45px 15px 15px;background:linear-gradient(transparent,rgba(5,7,12,.96));display:flex;flex-direction:column;gap:7px}.badge{font-size:10px;letter-spacing:.12em;color:#9fc2ff;font-weight:900}.title{font-weight:800;line-height:1.4}.meta{font-size:12px;color:#aeb6c4}.empty{padding:24px;border:1px dashed #303340;color:#9296a5}@media(max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card,.card img{min-height:230px;height:230px}.title{font-size:13px}}</style><script src="/analytics.js"></script></head><body><nav class="nav"><a class="brand" href="/"><span>MangaGo</span>Atlas</a><div class="navlinks"><a href="/">Home</a><a href="/admin/">Admin</a></div></nav><header class="hero"><h1>Latest Manga Chapters</h1><p>Recently published chapters from the manga library.</p></header><main class="wrap"><div id="count" class="count">Loading published chapters…</div><div id="list" class="grid"></div></main><script>
(async()=>{const root='https://mangogoatlasraw.github.io/';const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const norm=v=>String(v??'').toLowerCase().replace(/[-_](ja|raw)$/,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');const unwrap=d=>d&&typeof d.content==='string'?JSON.parse(d.content):d||{};const read=async p=>{const r=await fetch(root+p+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(p);return unwrap(await r.json())};const [d,m]=await Promise.all([read('data/content.json'),read('data/manual-chapters.json')]);const mangas=Array.isArray(d.mangas)?d.mangas:[];const chapters=[];const seen=new Set();for(const c of [...(m.chapters||[]),...(d.chapters||[])]){if(!c?.slug||seen.has(c.slug))continue;seen.add(c.slug);const mid=norm(c.mangaId||c.manga_id||c.manga||c.mangaTitle||'');const manga=mangas.find(x=>norm(x.id||x.slug||x.title)===mid)||mangas.find(x=>norm(x.title)===norm(c.mangaTitle||c.manga));if(manga&&!(String(manga.country||'').toLowerCase()==='jp'||String(manga.language||'').toLowerCase()==='ja'))continue;chapters.push({...c,_manga:manga})}chapters.sort((a,b)=>Date.parse(b.updatedAt||b.updated_at||b.createdAt||b.created_at||0)-Date.parse(a.updatedAt||a.updated_at||a.createdAt||a.created_at||0));document.getElementById('count').textContent=chapters.length+' published chapters';document.getElementById('list').innerHTML=chapters.map(c=>{const m=c._manga||{};let cover=m.cover||c.cover||c.cover_url||'';if(cover&&!(cover.startsWith('http://')||cover.startsWith('https://')))cover=root+cover.split('/').filter(Boolean).join('/');const title=m.title||c.mangaTitle||c.manga||'Manga';return '<a class="card" href="/chapter.html?slug='+encodeURIComponent(c.slug)+'">'+(cover?'<img src="'+esc(cover)+'" alt="'+esc(title)+'" loading="lazy" onerror="this.style.display=\'none\'">':'')+'<div class="overlay"><span class="badge">JAPANESE RELEASE</span><strong class="title">'+esc(title)+'</strong><span class="meta">'+esc(c.title||('Chapter '+(c.number??'')))+'</span><span class="meta">Open chapter →</span></div></a>'}).join('')||'<div class="empty">No published chapters found yet.</div>'})().catch(e=>{document.getElementById('count').textContent='Could not load chapters';document.getElementById('list').innerHTML='<div class="empty">Please refresh the page shortly.</div>';console.error(e)});
</script></body></html>
